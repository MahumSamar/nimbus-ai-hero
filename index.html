<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020811" />
  <title>Nimbus — your AI teammate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020811;
      --text: #f4f7ff;
      --muted: #a9b4cc;
      --accent: #4aa8ff;
      --gutter: clamp(16px, 4vw, 56px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background: var(--bg);
      touch-action: pan-y;
    }

    /* ---------- background video ---------- */
    .stage {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }
    .stage video {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      /* behave like object-fit: cover, anchored to the bottom so the robot is never cropped */
      width: max(100vw, calc(max(100svh, 560px) * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .stage video.ready { opacity: 1; }
    /* soft fade so any area above the video blends into the sky */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(2,8,17,.55) 0%, rgba(2,8,17,0) 60%);
    }

    /* ---------- nav ---------- */
    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 28px) var(--gutter);
      z-index: 2;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-family: "Inter Tight", sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: -.01em;
    }
    .brand svg { width: clamp(30px, 3.2vw, 42px); height: auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: #050b16;
      text-decoration: none;
      font-weight: 600;
      font-size: clamp(13px, 1.1vw, 15px);
      padding: 12px 22px;
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 8px 30px rgba(74,168,255,.18);
      transition: transform .2s ease, box-shadow .2s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,.3), 0 10px 40px rgba(74,168,255,.35); }

    /* ---------- copy ---------- */
    .copy {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: clamp(96px, 14vh, 130px) var(--gutter) 0;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-family: "Inter Tight", sans-serif;
      font-weight: 800;
      font-size: clamp(34px, 6.2vw, 86px);
      line-height: .98;
      letter-spacing: -.035em;
      text-wrap: balance;
      text-shadow: 0 2px 40px rgba(2,8,17,.6);
    }
    h1 span { display: block; }
    .sub {
      margin: clamp(14px, 2vh, 24px) auto 0;
      max-width: 34em;
      color: var(--muted);
      font-size: clamp(15px, 1.45vw, 19px);
      line-height: 1.55;
      text-wrap: balance;
    }

    /* entrance */
    .fade { opacity: 0; transform: translateY(14px); animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; }
    @keyframes in { to { opacity: 1; transform: none; } }

    /* ---------- mobile ---------- */
    @media (max-width: 640px) {
      .btn { padding: 10px 16px; }
      .btn .long { display: none; }
      .copy { padding-top: 110px; }
    }
    /* portrait: show the robot larger than "cover" would on a phone, still anchored bottom */
    @media (max-aspect-ratio: 4/5) {
      .stage video { width: max(230vw, calc(62svh * 16 / 9)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <div class="stage" aria-hidden="true">
      <video id="robot" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/53636b7c-5ee8-4264-9bab-0801e6b777ea.jpg" muted playsinline preload="auto" disablepictureinpicture></video>
    </div>

    <nav class="nav">
      <a class="brand" href="#" aria-label="Nimbus home">
        <svg viewBox="0 0 44 30" fill="none" aria-hidden="true">
          <path d="M12 27h21a8 8 0 0 0 1.2-15.9A11 11 0 0 0 13.4 9.3 9 9 0 0 0 12 27Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        Nimbus
      </a>
      <a class="btn" href="#">Add to <span class="long">your&nbsp;</span>workspace</a>
    </nav>

    <div class="copy">
      <h1 class="fade d1"><span>Meet Nimbus,</span><span>your AI teammate.</span></h1>
      <p class="sub fade d2">Nimbus floats through your team chat, answering questions, summarizing threads, and handling the busywork.</p>
    </div>
  </section>

  <script>
    (() => {
      const video = document.getElementById('robot');
      const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');
      const mobileMq = matchMedia('(max-width: 700px), (hover: none)');

      // The clip is a seamless loop of 33 frames @ 24fps (every frame a keyframe, no interpolated frames).
      // The head, visor and eye rings never move: both pupils roll together through one clockwise circle.
      const CDN = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
      const SRC_1080 = CDN + '164375f2-5bb8-4353-b8b6-bf9e6d4b4daf.mp4';
      const SRC_720  = CDN + 'e45eca8b-2c24-4aa4-a36b-95ae5d04d533.mp4';
      const small = Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1) < 1600 || window.innerWidth < 768;
      const SRC = small ? SRC_720 : SRC_1080;

      const FPS = 24, FRAMES = 33;
      const VIDEO_W = 1920;
      const EYE_X = 958, EYE_Y = 700;        // centre between the eyes, in source-video pixels

      // Calibration: [frame, gaze angle in degrees] anchors measured from the clip.
      // Angle uses screen coordinates (0° = right, 90° = down, 180° = left, 270° = up), unwrapped so it only increases.
      const ANCHORS = [6.8,16.6,26.3,35.5,50.9,63.2,73,82.5,100.2,111.1,121.8,130.9,147.8,157.3,167,175.6,192.9,202.1,
        212.6,222.9,240.7,250.4,261,270.1,284.7,293.5,301.6,309.5,324.2,331.6,340.2,347.8,361.6,366.8]
        .map((deg, f) => [f, deg]);
      const TAU = Math.PI * 2;
      const SAMPLES = [];                    // [angle (0..2π), frame] for every frame
      for (let f = 0, k = 0; f < FRAMES; f++) {
        while (ANCHORS[k + 1][0] < f) k++;
        const [f0, d0] = ANCHORS[k], [f1, d1] = ANCHORS[k + 1];
        const deg = d0 + (d1 - d0) * (f - f0) / (f1 - f0);
        SAMPLES.push([(deg % 360) * Math.PI / 180, f]);
      }

      // Every frame of this clip is clean, so CLEAN is an identity map (kept as a hook for skipping frames).
      const CLEAN = Array.from({ length: FRAMES }, (_, f) => f);

      let pointer = null;                    // last pointer position
      let targetFrame = 0;                   // frame whose gaze points at the cursor
      let pos = 0;                           // smoothed playhead, in frames, on the loop
      let lastSet = -1;
      let ready = false;

      const isMobile = () => mobileMq.matches;

      // Cursor → angle around the robot's eyes → closest calibrated frame
      const retarget = () => {
        if (!pointer || isMobile()) return;
        const rect = video.getBoundingClientRect();
        const scale = rect.width / VIDEO_W;
        const eyeX = rect.left + EYE_X * scale;
        const eyeY = rect.top + EYE_Y * scale;
        const dx = pointer.x - eyeX, dy = pointer.y - eyeY;
        if (Math.hypot(dx, dy) < 8) return;  // ignore the dead centre
        let angle = Math.atan2(dy, dx);
        if (angle < 0) angle += TAU;
        let best = 0, bestDist = Infinity;
        for (const [a, f] of SAMPLES) {
          let dist = Math.abs(a - angle);
          if (dist > Math.PI) dist = TAU - dist;   // circular distance
          if (dist < bestDist) { bestDist = dist; best = f; }
        }
        targetFrame = best;
      };

      // Scrub loop: the video is never played on desktop. The playhead glides along the loop
      // (taking the shorter way round, wrapping end → start) toward the target frame.
      const tick = () => {
        if (ready && !isMobile()) {
          let delta = targetFrame - pos;
          if (delta > FRAMES / 2) delta -= FRAMES;
          if (delta < -FRAMES / 2) delta += FRAMES;
          pos += delta * (reduceMq.matches ? 1 : 0.12);
          pos = ((pos % FRAMES) + FRAMES) % FRAMES;
          const maxT = (video.duration || FRAMES / FPS) - 1 / FPS;
          const t = Math.min((CLEAN[Math.round(pos) % FRAMES]) / FPS + 1 / 240, maxT);
          if (!video.seeking && Math.abs(t - lastSet) > 1 / 48) {
            video.currentTime = t;
            lastSet = t;
          }
        }
        requestAnimationFrame(tick);
      };

      // Desktop: paused + cursor scrubbing. Mobile / touch: the loop simply plays.
      const applyMode = () => {
        if (!ready) return;
        if (isMobile()) {
          video.loop = true;
          if (reduceMq.matches) video.pause();
          else { video.playbackRate = 0.35; const p = video.play(); if (p && p.catch) p.catch(() => {}); }
        } else {
          video.loop = false;
          video.pause();
          pos = (video.currentTime * FPS) % FRAMES;
          lastSet = -1;
          retarget();
        }
      };

      window.addEventListener('pointermove', (e) => { pointer = { x: e.clientX, y: e.clientY }; retarget(); }, { passive: true });
      let wasMobile = isMobile();
      window.addEventListener('resize', () => {
        if (isMobile() !== wasMobile) { wasMobile = isMobile(); applyMode(); }
        retarget();
      });
      window.addEventListener('scroll', retarget, { passive: true });
      window.addEventListener('pageshow', applyMode);
      mobileMq.addEventListener('change', applyMode);
      reduceMq.addEventListener('change', applyMode);

      video.addEventListener('loadeddata', () => {
        ready = true;
        video.classList.add('ready');
        applyMode();
      }, { once: true });

      // Pull the whole clip from the Higgsfield CDN into memory once so every seek is instant
      // (no range request per seek). Falls back to streaming the URL directly if fetch fails.
      fetch(SRC)
        .then((r) => { if (!r.ok) throw 0; return r.blob(); })
        .then((b) => { video.src = URL.createObjectURL(b); })
        .catch(() => { video.src = SRC; });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
